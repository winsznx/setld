[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "../evidence" }, { access = "read-write", path = "./out" }]
remappings = ["forge-std/=lib/forge-std/src/"]

[profile.ci]
verbosity = 3

[rpc_endpoints]
creditcoin_cc3 = "${CREDITCOIN_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[invariant]
runs = 128
depth = 64
fail_on_revert = false
