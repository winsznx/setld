name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - name: forge build
        run: cd contracts && forge build
      - name: forge test
        run: cd contracts && forge test -vv

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: cd contracts && forge build
      - uses: crytic/slither-action@v0.4.0
        continue-on-error: true
        with:
          target: contracts/
          slither-config: contracts/slither.config.json
          fail-on: none

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: parity vectors + reference model
        run: pnpm tsx scripts/gen-parity-vectors.ts && pnpm vitest run
      - name: web static export builds
        run: pnpm --filter @setld/web build

  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: submission facts + parity vectors are valid json
        run: |
          node -e "JSON.parse(require('fs').readFileSync('evidence/submission-facts.json'))"
          node -e "JSON.parse(require('fs').readFileSync('evidence/claims.json'))"
          node -e "JSON.parse(require('fs').readFileSync('evidence/parity/vectors.json'))"
          test -f GATES.md && test -f DECISIONS.md && test -f design.md && test -f WHITEPAPER.md
      - name: no stale chain id
        run: |
          if grep -rn "102543" --include="*.ts" --include="*.tsx" --include="*.sol" --include="*.md" --include="*.json" . \
             | grep -v node_modules | grep -v "contracts/lib/" | grep -v "DECISIONS.md"; then
            echo "stale chain id 102543 found"; exit 1
          fi
